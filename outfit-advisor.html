<!DOCTYPE html>
<html lang="zh-CN" data-sp-mode="scroll">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天穿什么 · 温馨穿衣搭配助手</title>
<style>
  :root{
    --accent:#e8967a;
    --accent-deep:#d97757;
    --bg:#fdf6ee;
    --panel:#fffdf9;
    --text:#5b4a3f;
    --text-light:#9b8a7d;
    --milk:#fbeee2;
    --border:#f5e3d3;
    --shadow:0 6px 24px rgba(217,119,87,.12);
    --result-a:#fff4e4;
    --result-b:#fdeade;
    --result-border:#f2ddc6;
  }
  body[data-theme=pink]{--accent:#e8a7b8;--accent-deep:#d97b93;--bg:#fdf1f3;--milk:#fbe7ec;--border:#f5dbe2;
    --shadow:0 6px 24px rgba(217,123,147,.12);--result-a:#fff0f3;--result-b:#fde8ed;--result-border:#f5d9e0;--text:#5f434a;--text-light:#a17f89;--panel:#fffafb}
  body[data-theme=green]{--accent:#a3bd8d;--accent-deep:#7fa066;--bg:#f4f7ee;--milk:#e8efdd;--border:#dfe8d2;
    --shadow:0 6px 24px rgba(127,160,102,.14);--result-a:#f2f7e8;--result-b:#e9f1dc;--result-border:#dde7cd;--text:#46503c;--text-light:#87907a;--panel:#fcfdf8}
  body[data-theme=blue]{--accent:#9db4c9;--accent-deep:#6f93b3;--bg:#f0f5f9;--milk:#e2ecf4;--border:#dae6ef;
    --shadow:0 6px 24px rgba(111,147,179,.14);--result-a:#ecf3f8;--result-b:#e2edf5;--result-border:#d5e3ee;--text:#3d4a55;--text-light:#7d8d9a;--panel:#fbfdfe}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,var(--milk) 0%,var(--bg) 40%,var(--milk) 100%);
    color:var(--text);
    min-height:100vh;
    line-height:1.6;
  }
  .topbar{max-width:960px;margin:0 auto;display:flex;justify-content:flex-end;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
  .theme-dot{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
  .theme-dot.on{outline:2px solid var(--accent-deep);outline-offset:2px}
  .hero{text-align:center;padding:clamp(20px,4vw,36px) 16px clamp(16px,3vw,28px)}
  .hero .sun{font-size:clamp(36px,6vw,52px)}
  .hero h1{font-size:clamp(26px,5vw,42px);color:var(--accent-deep);margin:6px 0 4px;letter-spacing:2px}
  .hero p{color:var(--text-light);font-size:clamp(13px,2.5vw,15px)}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 48px}
  .card{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:clamp(16px,3.5vw,26px);margin-bottom:20px;border:1px solid var(--border)}
  .card h2{font-size:clamp(16px,3vw,19px);color:var(--accent-deep);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .opts{display:flex;flex-wrap:wrap;gap:10px}
  .opt{padding:10px 16px;min-height:44px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-size:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
  .opt:hover{border-color:var(--accent);background:var(--milk)}
  .opt.on{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .opt.hint{opacity:.55;cursor:default;border-style:dashed}
  .swatch{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.12)}
  .result{background:linear-gradient(135deg,var(--result-a),var(--result-b));border:1px solid var(--result-border)}
  .result .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .result .big{font-size:clamp(34px,7vw,48px)}
  .result h3{font-size:clamp(18px,3.5vw,23px);color:var(--accent-deep)}
  .result .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .tag{background:#fff;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:4px 12px;font-size:13px}
  .tip{color:var(--text-light);font-size:14px}
  .empty{text-align:center;color:var(--text-light);padding:16px 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  .weather-line{font-size:14px;color:var(--text-light);margin-top:10px;min-height:22px}
  .weather-line b{color:var(--accent-deep)}
  .cityrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .cityrow input{flex:1;min-width:160px;padding:10px 14px;min-height:44px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:var(--text);font-size:14px;outline:none}
  .cityrow input:focus{border-color:var(--accent)}
  .cityrow button{flex-shrink:0}
  .showbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .figure{font-size:clamp(56px,12vw,84px);line-height:1.2;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
  .palette{display:flex;gap:8px;flex-wrap:wrap}
  .pcard{width:44px;text-align:center;font-size:11px;color:var(--text-light)}
  .pcard i{display:block;width:34px;height:34px;border-radius:12px;margin:0 auto 4px;border:1px solid rgba(0,0,0,.1)}
  .favlist{display:flex;flex-direction:column;gap:10px}
  .fav{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .fav .fav-emoji{font-size:24px}
  .fav .fav-main{flex:1;min-width:180px;font-size:13px}
  .fav .fav-main b{color:var(--accent-deep)}
  .fav button.del{padding:6px 12px;min-height:32px;font-size:12px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text-light);cursor:pointer}
  .fav button.del:hover{color:#c0392b;border-color:#c0392b}
  .btn{padding:10px 18px;min-height:44px;border-radius:999px;border:none;background:var(--accent-deep);color:#fff;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .btn:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.5;cursor:default}
  footer{text-align:center;color:var(--text-light);font-size:13px;padding:12px 0 28px}
  button:focus-visible{outline:2px solid var(--accent-deep)}
</style>
</head>
<body>
<div class="topbar" title="换配色">
  <span style="align-self:center;color:var(--text-light);font-size:13px">🎨 配色</span>
  <button class="theme-dot" data-theme="" style="background:#e8967a" aria-label="奶油橘"></button>
  <button class="theme-dot" data-theme="pink" style="background:#e8a7b8" aria-label="樱花粉"></button>
  <button class="theme-dot" data-theme="green" style="background:#a3bd8d" aria-label="抹茶绿"></button>
  <button class="theme-dot" data-theme="blue" style="background:#9db4c9" aria-label="雾霾蓝"></button>
</div>

<div class="hero">
  <div class="sun">🌤️</div>
  <h1>今天穿什么</h1>
  <p>查实时天气 · 定温度 · 挑一套喜欢的穿搭 ☕</p>
</div>

<div class="wrap">
  <div class="card">
    <h2>📍 城市实时天气</h2>
    <div class="cityrow">
      <input id="cityInput" placeholder="输入城市名，如：宁波 / 上海 / 哈尔滨" aria-label="城市名">
      <button class="btn" id="cityBtn">查天气</button>
    </div>
    <div class="weather-line" id="weatherLine">也可以不用查天气，直接在下面手动选择 ☁️</div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>🌦️ 今日天气</h2>
      <div class="opts" id="weatherOpts"></div>
    </div>
    <div class="card">
      <h2>🌡️ 当前温度</h2>
      <div class="opts" id="tempOpts"></div>
    </div>
  </div>

  <div class="card">
    <h2>📍 所在地区</h2>
    <div class="opts" id="regionOpts"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>👤 性别</h2>
      <div class="opts" id="genderOpts"></div>
    </div>
    <div class="card">
      <h2>🧥 款式 <span id="styleHint" style="font-size:12px;color:var(--text-light);font-weight:normal">（先在左侧选性别）</span></h2>
      <div class="opts" id="styleOpts"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>🎨 颜色偏好</h2>
      <div class="opts" id="colorOpts"></div>
    </div>
    <div class="card">
      <h2>👟 鞋子种类</h2>
      <div class="opts" id="shoeOpts"></div>
    </div>
  </div>

  <div class="card result">
    <h2>🧺 今日穿搭推荐</h2>
    <div id="resultBox"><div class="empty">完成上面的选择，小陶马上为你搭配 ✨</div></div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="favBtn">💖 收藏这套穿搭</button>
      <button class="btn" id="randBtn" style="background:var(--accent)">🎲 随机来一套</button>
    </div>
  </div>

  <div class="card">
    <h2>🪞 穿搭展示区</h2>
    <div id="showBox"><div class="empty">选好后这里会展示今日穿搭的整体效果 🪄</div></div>
  </div>

  <div class="card">
    <h2>💖 我的收藏 <span id="favCount" style="font-size:12px;color:var(--text-light);font-weight:normal"></span></h2>
    <div class="favlist" id="favList"><div class="empty">还没有收藏，搭配好后点「收藏这套穿搭」留个底 🤍</div></div>
  </div>
</div>

<footer>温馨提示：推荐仅供参考，穿得舒服最重要 🤍</footer>

<script>
(function(){
  var state={region:null,weather:null,temp:null,gender:null,style:null,color:null,shoe:null,city:null,liveTemp:null};
  var REGIONS=[
    {id:"huanan",name:"华南（广州/深圳）",season:"偏热，夏长冬短"},
    {id:"jiangnan",name:"江南（上海/宁波）",season:"四季分明，湿度较大"},
    {id:"huabei",name:"华北（北京/天津）",season:"春秋短，冬季干冷"},
    {id:"dongbei",name:"东北（哈尔滨/沈阳）",season:"冬季寒冷漫长"},
    {id:"xibei",name:"西北（西安/兰州）",season:"干燥，昼夜温差大"},
    {id:"xinan",name:"西南（成都/昆明）",season:"温和多雾，紫外线强"}
  ];
  var WEATHERS=[
    {id:"sunny",name:"晴 ☀️",tip:"紫外线可能较强"},
    {id:"cloudy",name:"多云 ⛅",tip:"体感舒适"},
    {id:"rain",name:"下雨 🌧️",tip:"记得带伞"},
    {id:"snow",name:"下雪 ❄️",tip:"注意防滑保暖"},
    {id:"wind",name:"大风 💨",tip:"防风是关键"}
  ];
  var TEMPS=[
    {id:"cold",name:"≤ 0°C 🥶",label:"严寒",lo:-99,hi:0},
    {id:"cool",name:"0~10°C 🧥",label:"寒冷",lo:0,hi:10},
    {id:"mild",name:"10~18°C 👕",label:"微凉",lo:10,hi:18},
    {id:"warm",name:"18~26°C 🌿",label:"舒适",lo:18,hi:26},
    {id:"hot",name:"> 26°C 🍉",label:"炎热",lo:26,hi:99}
  ];
  var GENDERS=[{id:"m",name:"男生 👦"},{id:"f",name:"女生 👧"}];
  var STYLES={
    m:[{id:"casual",name:"休闲 🧢"},{id:"sport",name:"运动 🏃"},{id:"business",name:"商务 👔"},{id:"street",name:"街头 🛹"}],
    f:[{id:"sweet",name:"甜美 🎀"},{id:"casual",name:"休闲 🧢"},{id:"elegant",name:"优雅 👗"},{id:"sport",name:"运动 🏃"}]
  };
  var COLORS=[
    {id:"cream",name:"奶油白",hex:"#f6efe3"},
    {id:"brown",name:"大地棕",hex:"#a67c52"},
    {id:"pink",name:"樱花粉",hex:"#f3c1c6"},
    {id:"blue",name:"雾霾蓝",hex:"#9db4c9"},
    {id:"green",name:"抹茶绿",hex:"#b5c9a5"},
    {id:"black",name:"经典黑",hex:"#3d3a37"},
    {id:"orange",name:"暖橘",hex:"#e8967a"},
    {id:"grey",name:"燕麦灰",hex:"#c9c0b4"}
  ];
  var SHOES=[
    {id:"sneaker",name:"运动鞋 👟"},{id:"boot",name:"短靴 🥾"},{id:"leather",name:"皮鞋 👞"},
    {id:"canvas",name:"帆布鞋 🩰"},{id:"sandal",name:"凉鞋 🩴"},{id:"snowboot",name:"雪地靴 🧦"}
  ];
  var WARDROBE={
    cold:{m:{top:"加厚羽绒服 + 高领毛衣",bottom:"加绒牛仔裤",extra:"围巾 + 手套 + 毛线帽"},
          f:{top:"长款羽绒服 + 针织连衣裙",bottom:"加绒打底裤",extra:"围巾 + 毛线帽"}},
    cool:{m:{top:"呢子大衣 / 棉服 + 卫衣",bottom:"厚款休闲裤",extra:"薄围巾"},
          f:{top:"呢子大衣 + 毛衣",bottom:"长裙 / 厚裤",extra:"贝雷帽"}},
    mild:{m:{top:"夹克 / 风衣 + 长袖T恤",bottom:"牛仔裤",extra:"薄外套备一件"},
          f:{top:"针织开衫 + 衬衫裙",bottom:"半身裙 / 直筒裤",extra:"丝巾点缀"}},
    warm:{m:{top:"短袖T恤 / 薄衬衫",bottom:"休闲裤 / 短裤",extra:"防晒备起来"},
          f:{top:"连衣裙 / 短袖上衣",bottom:"半身裙 / 阔腿裤",extra:"防晒小外套"}},
    hot:{m:{top:"速干短袖",bottom:"短裤",extra:"遮阳帽 + 冰袖"},
         f:{top:"吊带 + 防晒衫",bottom:"短裙 / 短裤",extra:"草帽 + 防晒霜"}}
  };
  var WEATHER_ADJ={
    rain:{m:"外搭防水冲锋衣，鞋子选防水的",f:"带一把好看的伞，鞋子选防水款"},
    snow:{m:"换成防滑雪地靴，加保暖内搭",f:"换成雪地靴，套上加绒袜"},
    wind:{m:"加一件防风外套，扣好拉链",f:"加一件风衣，扎起头发"},
    sunny:{m:"选浅色系更凉爽，注意防晒",f:"浅色系显清爽，记得涂防晒"},
    cloudy:{m:"正常穿搭即可",f:"正常穿搭即可"}
  };
  var SHOE_FIX={cold:"雪地靴",cool:"短靴",mild:"帆布鞋/运动鞋",warm:"运动鞋/凉鞋",hot:"凉鞋/透气运动鞋"};
  var STYLE_EMOJI={casual:"🧢👕",sport:"🏃🎽",business:"👔💼",street:"🛹🧢",sweet:"🎀👗",elegant:"👗👠"};
  var FIGURE={m:"🧍‍♂️",f:"🧍‍♀️"};
  var TEMP_EMOJI={cold:"🧤",cool:"🧣",mild:"🧥",warm:"🌿",hot:"🩳"};

  function find(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
  function esc(t){var d=document.createElement("div");d.textContent=(t==null?"":String(t));return d.innerHTML;}
  function tempIdByValue(v){
    if(v<=0)return "cold";if(v<10)return "cool";if(v<18)return "mild";if(v<=26)return "warm";return "hot";
  }
  function codeToWeather(c){
    if(c===45||c===48)return "cloudy";
    if(c<=1)return "sunny";
    if(c<=3)return "cloudy";
    if((c>=51&&c<=67)||(c>=80&&c<=82)||c>=95)return "rain";
    if((c>=71&&c<=77)||c===85||c===86)return "snow";
    return "cloudy";
  }

  function mkOpts(elId,list,type,isColor,placeholder){
    var host=document.getElementById(elId);
    host.innerHTML="";
    if(placeholder&&list.length===0){
      var h=document.createElement("span");
      h.className="opt hint";h.textContent=placeholder;
      host.appendChild(h);return;
    }
    list.forEach(function(item){
      var b=document.createElement("button");
      b.className="opt";b.type="button";
      if(isColor){
        var s=document.createElement("span");s.className="swatch";s.style.background=item.hex;
        b.appendChild(s);b.appendChild(document.createTextNode(item.name));
      }else{b.textContent=item.name;}
      if(state[type]===item.id)b.classList.add("on");
      b.addEventListener("click",function(){
        state[type]=item.id;
        if(type==="gender"){state.style=null;}
        renderAll();
      });
      host.appendChild(b);
    });
  }

  // ===== 实时天气 =====
  function fetchWeather(){
    var city=document.getElementById("cityInput").value.trim();
    var line=document.getElementById("weatherLine");
    if(!city){line.textContent="请先输入城市名哦 🙏";return;}
    line.textContent="正在查询「"+city+"」的实时天气…⏳";
    var gl="https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&format=json&name="+encodeURIComponent(city);
    fetch(gl).then(function(r){return r.json();}).then(function(g){
      if(!g.results||!g.results.length){line.textContent="没找到城市「"+esc(city)+"」，换个名字试试？🗺️";return;}
      var loc=g.results[0];
      var wl="https://api.open-meteo.com/v1/forecast?latitude="+loc.latitude+"&longitude="+loc.longitude+"&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto";
      return fetch(wl).then(function(r){return r.json();}).then(function(w){
        var c=w.current;
        state.city=loc.name;
        state.liveTemp=Math.round(c.temperature_2m);
        state.weather=codeToWeather(c.weather_code);
        state.temp=tempIdByValue(c.temperature_2m);
        var speed=Math.round(c.wind_speed_10m);
        if(speed>=30){state.weather="wind";}
        var wName=find(WEATHERS,state.weather)?find(WEATHERS,state.weather).name:"—";
        var tName=find(TEMPS,state.temp)?find(TEMPS,state.temp).label:"—";
        line.innerHTML="📍 <b>"+esc(loc.name)+"</b> 实时 "+state.liveTemp+"°C · "+esc(wName)+" · 风速 "+speed+"km/h —— 已自动选好天气「<b>"+esc(tName)+"</b>」档，可手动微调 ✅";
        renderAll();
      });
    }).catch(function(){line.textContent="天气查询失败了（网络原因），可以手动选下面的天气和温度 🙏";});
  }

  // ===== 收藏 =====
  function favKey(){return "outfit-favs-v1";}
  function loadFavs(){try{return JSON.parse(localStorage.getItem(favKey())||"[]");}catch(e){return [];}}
  function saveFavs(a){try{localStorage.setItem(favKey(),JSON.stringify(a));}catch(e){}}
  function renderFavs(){
    var list=loadFavs(),host=document.getElementById("favList");
    document.getElementById("favCount").textContent=list.length?("（"+list.length+" 套）"):"";
    if(!list.length){host.innerHTML='<div class="empty">还没有收藏，搭配好后点「收藏这套穿搭」留个底 🤍</div>';return;}
    host.innerHTML="";
    list.forEach(function(f,idx){
      var d=document.createElement("div");d.className="fav";
      d.innerHTML='<span class="fav-emoji">'+esc(f.emoji)+'</span>'
        +'<span class="fav-main"><b>'+esc(f.title)+'</b> · '+esc(f.date)
        +'<br>'+esc(f.summary)+'</span>';
      var del=document.createElement("button");del.className="del";del.textContent="删除";
      del.addEventListener("click",function(){var a=loadFavs();a.splice(idx,1);saveFavs(a);renderFavs();});
      d.appendChild(del);host.appendChild(d);
    });
  }
  function currentSnapshot(){
    var g=state.gender&&GENDERS.filter(function(x){return x.id===state.gender;})[0];
    var st=state.style&&STYLES[state.gender]&&STYLES[state.gender].filter(function(x){return x.id===state.style;})[0];
    var t=state.temp&&TEMPS.filter(function(x){return x.id===state.temp;})[0];
    if(!(g&&st&&t))return null;
    return {
      emoji:FIGURE[state.gender]+" "+(STYLE_EMOJI[state.style]||""),
      title:g.name.replace(" 👦","").replace(" 👧","")+" · "+st.name.split(" ")[0]+"风 · "+t.label+"天",
      date:new Date().toLocaleDateString("zh-CN"),
      summary:(state.liveTemp!=null?("实时"+state.liveTemp+"°C · "):"")+
        (state.city?state.city+" · ":"")+

  function hexHueSat(hex){
    var n=parseInt(hex.slice(1),16),r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0,s=mx===0?0:d/mx;
    if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
    return {h:h,s:s,v:mx};
  }
  function photoFilter(hex){
    var c=hexHueSat(hex);
    if(c.s<0.18){return c.v<0.25?"grayscale(.9) contrast(1.05)":"grayscale(.75) sepia(.18) brightness(1.03)";}
    var rot=(c.h-35+360)%360;
    return "sepia(.38) saturate(1.5) hue-rotate("+Math.round(rot)+"deg) brightness("+(c.v<0.3?0.92:1)+")";
  }

  function shade(hex,f){
    var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    function c(v){v=Math.round(v*f);return Math.max(0,Math.min(255,v));}
    return "rgb("+c(r)+","+c(g)+","+c(b)+")";
  }

  function renderResult(){

      var missing=[];

  // 主题
  var savedTheme=(function(){try{return localStorage.getItem("outfit-theme")||"";}catch(e){return "";}})();
  function applyTheme(t){
    if(t)document.body.setAttribute("data-theme",t);else document.body.removeAttribute("data-theme");
    try{localStorage.setItem("outfit-theme",t);}catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll(".theme-dot"),function(d){
      d.classList.toggle("on",d.getAttribute("data-theme")===t);
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".theme-dot"),function(d){
    d.addEventListener("click",function(){applyTheme(d.getAttribute("data-theme"));});
  });
  applyTheme(savedTheme);

  document.getElementById("cityInput").addEventListener("keydown",function(e){if(e.key==="Enter")fetchWeather();});

    function pick(arr){return arr[Math.floor(Math.random()*arr.length)].id;}

    state.gender=pick(GENDERS);state.style=pick(STYLES[state.gender]||[{id:"casual"}]);

})();
